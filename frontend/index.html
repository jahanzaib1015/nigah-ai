<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F172A">
  <title>Nigah AI — Aapki Aankhein, Aapke Sath</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="home-body">
  <div class="glow glow-1" aria-hidden="true"></div>
  <div class="glow glow-2" aria-hidden="true"></div>

  <main class="home-shell">
    <header class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </div>
      <h1 class="app-name">Nigah AI</h1>
      <p class="tagline">Aapki Aankhein, Aapke Sath</p>
    </header>

    <section class="actions" aria-label="Main features">
      <a class="action-card" href="scan.html" aria-label="Currency Pehchano — note scan kar ke value foran jaanein">
        <span class="action-icon" aria-hidden="true">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="6" width="20" height="12" rx="2"></rect>
            <circle cx="12" cy="12" r="2.5"></circle>
            <path d="M6 12h.01M18 12h.01"></path>
          </svg>
        </span>
        <span class="action-text">
          <span class="action-title">Currency Pehchano</span>
          <span class="action-desc">Note ki value foran jaanein</span>
        </span>
        <span class="action-chevron" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 5 7 7-7 7"></path>
          </svg>
        </span>
      </a>

      <a class="action-card" href="medicine.html" aria-label="Dawai Pehchano — dawai scan kar ke naam jaanein">
        <span class="action-icon" aria-hidden="true">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7z"></path>
            <path d="m8.5 8.5 7 7"></path>
          </svg>
        </span>
        <span class="action-text">
          <span class="action-title">Dawai Pehchano</span>
          <span class="action-desc">Dawai ki maloomat jaanein</span>
        </span>
        <span class="action-chevron" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 5 7 7-7 7"></path>
          </svg>
        </span>
      </a>
    </section>

    <footer class="home-footer">
      <a class="meri-list" href="list.html" aria-label="Meri List — apni scanned items dekhein">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 6h13M8 12h13M8 18h13"></path>
          <path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"></path>
        </svg>
        Meri List
      </a>
    </footer>
  </main>
</body>
</html>
